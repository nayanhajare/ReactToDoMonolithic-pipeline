name: Todo App CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: cmd
        run: npm install

      - name: Cleanup
        if: always()
        shell: cmd
        run: |
          if exist node_modules rmdir /s /q node_modules
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
